# DE regional exit (geo-de) → yunyoo-de-fra
# Domain-only. IP CIDRs live in geo-de-ip.yaml (route only; never DNS).
# Includes Wi-Fi Calling ePDG and carrier sites.
# N26 is geosite:n26, grouped with this bucket in NetworkTurbo confs (not listed here).
# Base: HenryChiao wificalling-de.list + Netify MCC 262 (2026-08-09 DoH)
# Dropped: mnc004 NXDOMAIN; mnc042/043 → 127.0.0.1; mnc020 (no clear brand);
#          ims.mnc002 NXDOMAIN; vodafone-dns.net NXDOMAIN; tech26.de (NS only, no A)
# Policy: every carrier block includes its consumer website.
payload:
  # Deutsche Telekom (mnc001)
  - DOMAIN-SUFFIX,epdg.epc.mnc001.mcc262.pub.3gppnetwork.org
  - DOMAIN-SUFFIX,telekom.de
  - DOMAIN-SUFFIX,t-online.de

  # Vodafone DE (mnc002; CNAME epdg.epc.drz1.vodafone-ip.de — often no A outside DE)
  - DOMAIN-SUFFIX,epdg.epc.mnc002.mcc262.pub.3gppnetwork.org
  - DOMAIN-SUFFIX,epdg.epc.drz1.vodafone-ip.de
  - DOMAIN-SUFFIX,epdg.epc.mnc009.mcc262.pub.3gppnetwork.org
